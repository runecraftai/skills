<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Grimoire skill discovery flow</title>
  <desc id="desc">Choose from skill categories or detect a project's stack, then install selected skills for Pi, Claude, Codex, or OpenCode.</desc>
  <rect width="1200" height="420" rx="28" fill="#0b0d12"/>
  <path d="M56 104H1144M56 350H1144" stroke="#252a36"/>
  <text x="64" y="68" fill="#aab3c5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">GRIMOIRE / DISCOVERY TO INSTALL</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="64" y="145" width="272" height="136" rx="18" fill="#151923" stroke="#343b4b"/>
    <text x="88" y="181" fill="#8d9aff" font-size="17" font-weight="700">01  FIND A SKILL</text>
    <text x="88" y="220" fill="#f4f6fb" font-size="25" font-weight="700">Categories</text>
    <text x="88" y="251" fill="#aab3c5" font-size="18">or detect your project</text>
    <path d="M336 213H410" stroke="#6874ff" stroke-width="3"/><path d="m400 203 12 10-12 10" fill="none" stroke="#6874ff" stroke-width="3"/>
    <rect x="432" y="145" width="304" height="136" rx="18" fill="#151923" stroke="#343b4b"/>
    <text x="456" y="181" fill="#58d6b0" font-size="17" font-weight="700">02  REVIEW</text>
    <text x="456" y="220" fill="#f4f6fb" font-size="25" font-weight="700">Recommendations</text>
    <text x="456" y="251" fill="#aab3c5" font-size="18">select skills, then confirm</text>
    <path d="M736 213H810" stroke="#58d6b0" stroke-width="3"/><path d="m800 203 12 10-12 10" fill="none" stroke="#58d6b0" stroke-width="3"/>
    <rect x="832" y="145" width="304" height="136" rx="18" fill="#151923" stroke="#343b4b"/>
    <text x="856" y="181" fill="#f0b86e" font-size="17" font-weight="700">03  INSTALL</text>
    <text x="856" y="220" fill="#f4f6fb" font-size="25" font-weight="700">Your agent</text>
    <text x="856" y="251" fill="#aab3c5" font-size="18">Pi · Claude · Codex · OpenCode</text>
  </g>
  <text x="64" y="388" fill="#667085" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">interactive by default  ·  explicit confirmation  ·  safe conflict handling</text>
</svg>
