name: Changesets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Apply changesets
        run: bun run version
      - name: Commit version and tag
        run: |
          if git diff --quiet; then
            echo "No pending changesets."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/skills/package.json packages/skills/CHANGELOG.md .changeset
          git commit -m "chore: release @runecraft/skills"
          VERSION=$(node -p 'require("./packages/skills/package.json").version')
          git tag "v${VERSION}"
          git push origin HEAD:main "v${VERSION}"
