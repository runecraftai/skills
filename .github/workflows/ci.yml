name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - name: Verify generated catalog is up to date
        run: |
          export CATALOG_REVISION=$(node -e 'console.log(require("./packages/skills/catalog/v1/registry.json").revision)')
          export CATALOG_GENERATED_AT=$(node -e 'console.log(require("./packages/skills/catalog/v1/registry.json").generatedAt)')
          bun run --cwd packages/skills catalog:generate
          git diff --exit-code -- packages/skills/catalog/v1/registry.json packages/skills/catalog.json packages/skills/catalog/v1/skills
          test -z "$(git status --porcelain -- packages/skills/catalog/v1/registry.json packages/skills/catalog.json packages/skills/catalog/v1/skills)"

  packaged-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.runtime == 'node'
        with:
          node-version: 26.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack and install CLI
        run: |
          mkdir -p "$RUNNER_TEMP/grimoire-consumer"
          npm pack --workspace @runecraft/grimoire --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/grimoire-consumer"
          npm init -y
          npm install --workspaces=false --no-audit --no-fund "$RUNNER_TEMP"/runecraft-grimoire-*.tgz
      - name: Verify scriptable commands do not initialize OpenTUI natives
        run: |
          if [ "${{ matrix.runtime }}" = node ]; then CLI=("$RUNNER_TEMP/grimoire-consumer/node_modules/.bin/grimoire"); else CLI=(bun "$RUNNER_TEMP/grimoire-consumer/node_modules/@runecraft/grimoire/dist/grimoire.js"); fi
          OPENTUI_LIBC=invalid "${CLI[@]}" --help
          OPENTUI_LIBC=invalid "${CLI[@]}" --version
          OPENTUI_LIBC=invalid "${CLI[@]}" list
          OPENTUI_LIBC=invalid "${CLI[@]}" search debugging
          OPENTUI_LIBC=invalid "${CLI[@]}" detect
          OPENTUI_LIBC=invalid "${CLI[@]}" status
      - name: Exercise packaged PTY lifecycle and non-TTY contract
        run: |
          if [ "${{ matrix.runtime }}" = node ]; then CLI=("$RUNNER_TEMP/grimoire-consumer/node_modules/.bin/grimoire"); else CLI=(bun "$RUNNER_TEMP/grimoire-consumer/node_modules/@runecraft/grimoire/dist/grimoire.js"); fi
          BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 python3 packages/skills/test/pty-smoke.py "${CLI[@]}"
      - name: Require an actionable missing-native failure
        run: |
          if [ "${{ matrix.runtime }}" = node ]; then CLI=("$RUNNER_TEMP/grimoire-consumer/node_modules/.bin/grimoire"); else CLI=(bun "$RUNNER_TEMP/grimoire-consumer/node_modules/@runecraft/grimoire/dist/grimoire.js"); fi
          native="$RUNNER_TEMP/grimoire-consumer/node_modules/@opentui/core-linux-x64"
          mv "$native" "$native.disabled"
          trap 'mv "$native.disabled" "$native"' EXIT
          GRIMOIRE_EXPECT_NATIVE_ERROR=1 BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 python3 packages/skills/test/pty-smoke.py "${CLI[@]}"
